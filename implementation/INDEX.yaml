# 이 폴더 직속의 md가 아닌 항목과 폴더의 설명. 항목 이름마다 description을 적는다.
"punctuation/":
  description: 문장 부호 세부 규정. 비ASCII 부호를 바꾸는 표기, 부호 자체를 가리키는 표기, 원형을 쓰는 영역
"reference-notation/":
  description: 참조 표기 세부 규정. 본문 링크 우선, 표지 세 가지의 판정, 옛 표기 cf.와 ref.의 교정 절차
"word-choice/":
  description: 어휘 선택 세부 규정. 외래어, 번역어, 원문 표기 가운데 무엇을 쓸지와 통용 어휘의 선택
